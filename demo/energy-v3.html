<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>能量命盘 · 水墨 / 星云 / 活力环</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --mu:#2FB36F; --huo:#FF5A36; --tu:#E0A12A; --jin:#9AA6B2; --shui:#3D8BF5;
  }
  body{ max-width:440px; margin:0 auto; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  section{ padding:30px 22px 36px; }
  .t{ font-size:14px; letter-spacing:3px; margin-bottom:4px; }
  .d{ font-size:11px; margin-bottom:22px; opacity:.6; }
  .pl-h{ text-align:center; font-size:11px; letter-spacing:2px; margin-bottom:8px; }
  .grid4{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }

  /* ========== A 水墨浓淡（浅底） ========== */
  .ink{ background:
        radial-gradient(120% 80% at 50% 0%, #FBF6EA 0%, #F2E9D6 70%, #ECE1CA 100%);
        color:#2A2622; }
  .ink .t,.ink .d{ color:#7A6F58; }
  .ink .pl-h{ color:#A99B7E; }
  .ink .box{ height:108px; display:flex; flex-direction:column; align-items:center;
             justify-content:center; gap:6px; position:relative; }
  .ink .c{ font-family:"STKaiti","KaiTi","Songti SC",serif; font-weight:800; line-height:1;
           transition:all 1s cubic-bezier(.2,.7,.2,1); }
  .ink .g{ font-size:10px; letter-spacing:1px; }
  .ink .dot{ width:0; height:3px; border-radius:3px; transition:width .9s .3s; }
  .ink .day .c::after{ content:"日主"; position:absolute; top:0; right:4px; font-size:9px;
                       color:#9a7b27; border:1px solid #cdb15c; border-radius:5px; padding:0 4px; }

  /* ========== B 气泡星云（暗底） ========== */
  .neb{ background:radial-gradient(120% 90% at 50% 30%,#191334 0%,#0C0820 60%,#070512 100%);
        color:#EDE9FB; }
  .neb .t{ color:#B9AEEA; } .neb .d{ color:#7A719E; }
  .neb .stage{ position:relative; height:330px; }
  .neb .bub{ position:absolute; border-radius:50%; display:flex; flex-direction:column;
             align-items:center; justify-content:center; transform:translate(-50%,-50%) scale(0);
             transition:transform 1s cubic-bezier(.2,.9,.3,1); }
  .neb .bub .c{ font-family:"STKaiti","KaiTi",serif; font-weight:800; color:#fff; line-height:1; }
  .neb .bub .g{ font-size:9px; color:rgba(255,255,255,.8); margin-top:2px; }

  /* ========== C 活力环（暗底） ========== */
  .ring{ background:#0E0A1C; color:#EDE9FB; }
  .ring .t{ color:#B9AEEA; } .ring .d{ color:#7A719E; }
  .ring .pl-h{ color:#655D86; }
  .ring .box{ height:104px; display:flex; align-items:center; justify-content:center; }
  .ring .r{ width:74px; height:74px; border-radius:50%; display:flex; align-items:center;
            justify-content:center; position:relative;
            -webkit-mask:radial-gradient(transparent 56%, #000 57%);
                    mask:radial-gradient(transparent 56%, #000 57%);
            transition:background 1.2s cubic-bezier(.2,.7,.2,1); }
  .ring .face{ position:absolute; inset:0; display:flex; flex-direction:column;
               align-items:center; justify-content:center; }
  .ring .c{ font-family:"STKaiti","KaiTi",serif; font-weight:800; font-size:26px; line-height:1; }
  .ring .g{ font-size:9px; color:#8c84ad; margin-top:3px; }
  .ring .day .c{ text-shadow:0 0 10px rgba(244,217,139,.5); }
</style>
</head>
<body>

<!-- A 水墨 -->
<section class="ink">
  <div class="t">方案 A · 水墨浓淡</div>
  <div class="d">能量越大，字越大越浓黑；越弱越小越灰淡</div>
  <div class="grid4" id="inkH"></div>
  <div class="grid4" id="inkG" style="margin-top:6px"></div>
</section>

<!-- B 星云 -->
<section class="neb">
  <div class="t">方案 B · 气泡星云</div>
  <div class="d">每个十神是一颗星球，越大越旺，主宰全局者居中最大</div>
  <div class="stage" id="neb"></div>
</section>

<!-- C 活力环 -->
<section class="ring">
  <div class="t">方案 C · 活力环</div>
  <div class="d">圆环走得越满，能量越大；最弱只剩一小段弧</div>
  <div class="grid4" id="ringH"></div>
  <div class="grid4" id="ringG" style="margin-top:6px"></div>
</section>

<script>
var WX={木:'mu',火:'huo',土:'tu',金:'jin',水:'shui'};
var COL={mu:'#2FB36F',huo:'#FF5A36',tu:'#E0A12A',jin:'#9AA6B2',shui:'#3D8BF5'};
function col(x){return COL[WX[x.wx]];}

var gan=[
  {c:'戊',wx:'土',god:'劫财',e:1.523},
  {c:'壬',wx:'水',god:'正财',e:0.584},
  {c:'己',wx:'土',god:'日主',e:1.643,day:true},
  {c:'乙',wx:'木',god:'七杀',e:0.603},
];
var zhi=[
  {c:'辰',wx:'土',god:'劫财',e:0.985},
  {c:'戌',wx:'土',god:'劫财',e:1.850},
  {c:'未',wx:'土',god:'比肩',e:1.330},
  {c:'丑',wx:'土',god:'比肩',e:0.920},
];
var all=gan.concat(zhi);
var maxE=Math.max.apply(null,all.map(function(x){return x.e}));

['inkH','ringH'].forEach(function(id){
  document.getElementById(id).innerHTML=['年','月','日','时']
    .map(function(t){return '<div class="pl-h">'+t+'</div>'}).join('');
});

/* A 水墨：字号 18~64，墨色 alpha .28~1 */
function inkCell(x){
  var r=x.e/maxE, fz=18+r*46, a=(0.26+r*0.74).toFixed(2);
  return '<div class="box '+(x.day?'day':'')+'">'+
    '<div class="c" data-fz="'+fz.toFixed(0)+'" data-a="'+a+'" style="color:rgba(30,26,22,'+a+')">'+x.c+'</div>'+
    '<div class="dot" data-w="'+(14+r*30).toFixed(0)+'" style="background:'+col(x)+'"></div>'+
    '<div class="g" style="color:'+col(x)+'">'+x.god+'</div></div>';
}
document.getElementById('inkG').innerHTML=gan.map(inkCell).join('')+zhi.map(inkCell).join('');

/* B 星云：直径按能量，黄金角螺旋布点（最大居中） */
var sorted=all.slice().sort(function(a,b){return b.e-a.e});
var stage=document.getElementById('neb'), W=396, H=330, html='';
sorted.forEach(function(x,i){
  var r=x.e/maxE, dia=46+Math.pow(r,0.8)*96;
  var ang=i*137.5*Math.PI/180, rad=i===0?0:(30+Math.sqrt(i)*46);
  var cx=W/2+Math.cos(ang)*rad, cy=H/2+Math.sin(ang)*rad*0.82;
  var c=col(x);
  html+='<div class="bub" data-i="'+i+'" style="width:'+dia+'px;height:'+dia+'px;left:'+cx+'px;top:'+cy+'px;'+
    'background:radial-gradient(circle at 35% 30%, '+c+'ee, '+c+'99 70%, '+c+'55);'+
    'box-shadow:0 0 22px '+c+'66, inset 0 0 18px rgba(255,255,255,.12)">'+
    '<div class="c" style="font-size:'+(dia*0.34).toFixed(0)+'px">'+x.c+'</div>'+
    '<div class="g">'+x.god+'</div></div>';
});
stage.innerHTML=html;

/* C 活力环：conic 填充角度 */
function ringCell(x){
  var r=x.e/maxE, deg=Math.round(r*360), c=col(x);
  return '<div class="box '+(x.day?'day':'')+'">'+
    '<div class="r" data-deg="'+deg+'" data-c="'+c+'" '+
      'style="background:conic-gradient('+c+' 0deg, rgba(255,255,255,.08) 0deg)">'+
      '<div class="face"><div class="c" style="color:'+c+'">'+x.c+'</div>'+
      '<div class="g">'+x.god+'</div></div></div></div>';
}
document.getElementById('ringG').innerHTML=gan.map(ringCell).join('')+zhi.map(ringCell).join('');

/* 入场动画 */
setTimeout(function(){
  document.querySelectorAll('.ink .c').forEach(function(e){ e.style.fontSize=e.dataset.fz+'px'; });
  document.querySelectorAll('.ink .dot').forEach(function(e){ e.style.width=e.dataset.w+'px'; });
  document.querySelectorAll('.neb .bub').forEach(function(e,i){
    setTimeout(function(){ e.style.transform='translate(-50%,-50%) scale(1)'; }, i*90);
  });
  document.querySelectorAll('.ring .r').forEach(function(e){
    e.style.background='conic-gradient('+e.dataset.c+' '+e.dataset.deg+'deg, rgba(255,255,255,.08) '+e.dataset.deg+'deg)';
  });
},150);
</script>
</body>
</html>
