<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Black Cat Sprite Player</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202635;
      background:
        radial-gradient(circle at 18% 12%, rgba(225, 159, 46, 0.32), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(69, 111, 140, 0.34), transparent 34%),
        linear-gradient(145deg, #1c3743, #d29b34 48%, #152833);
    }

    .page {
      width: min(980px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 32px 0 42px;
    }

    h1 {
      margin: 0 0 8px;
      color: #fff8df;
      font-size: 29px;
      letter-spacing: 0;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.28);
    }

    .lead {
      margin: 0 0 22px;
      max-width: 760px;
      color: rgba(255, 248, 223, 0.86);
      line-height: 1.7;
      font-size: 15px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(300px, 0.9fr) minmax(0, 1.1fr);
      gap: 18px;
      align-items: start;
    }

    .card {
      border: 1px solid rgba(255, 248, 223, 0.18);
      border-radius: 8px;
      background: rgba(255, 248, 223, 0.76);
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.24);
      backdrop-filter: blur(8px);
    }

    .player-card {
      padding: 18px;
    }

    .sprite-window {
      width: min(100%, 360px);
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border: 1px solid rgba(32, 38, 53, 0.12);
      border-radius: 8px;
      background-image: url("./black-cat-sprite-grid.png");
      background-size: 300% 200%;
      background-repeat: no-repeat;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
    }

    .readout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 14px;
      color: #4c5668;
      font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .readout span {
      padding: 8px 9px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.56);
      border: 1px solid rgba(32, 38, 53, 0.08);
    }

    .controls {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 74px 1fr 54px;
      align-items: center;
      gap: 10px;
      color: #4f5a6d;
      font-size: 13px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #8a4a21;
    }

    button {
      height: 38px;
      border: 1px solid rgba(138, 74, 33, 0.36);
      border-radius: 8px;
      color: #8a4a21;
      background: rgba(255, 225, 158, 0.56);
      font-weight: 700;
      cursor: pointer;
    }

    .sheet-card {
      padding: 18px;
    }

    .sheet-card h2 {
      margin: 0 0 10px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .sheet-card p {
      margin: 0 0 14px;
      color: #5e687a;
      line-height: 1.65;
      font-size: 14px;
    }

    .sheet-img {
      display: block;
      width: 100%;
      border-radius: 8px;
      border: 1px solid rgba(32, 38, 53, 0.12);
    }

    .code {
      margin: 14px 0 0;
      padding: 13px;
      border-radius: 8px;
      overflow-x: auto;
      color: #f8f2df;
      background: #202737;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    @media (max-width: 840px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>黑猫逐帧：眨眼 + 摇尾巴</h1>
    <p class="lead">
      这是用同一张生成的 2×3 sprite sheet 切格播放。每一格是一帧，播放时只是切换背景位置，所以属于逐帧动画。
    </p>

    <section class="layout">
      <article class="card player-card">
        <div class="sprite-window" id="sprite"></div>
        <div class="readout">
          <span id="frameText">frame: 1 / 6</span>
          <span id="poseText">eyes open</span>
        </div>
        <div class="controls">
          <div class="control-row">
            <label for="speed">速度</label>
            <input id="speed" type="range" min="100" max="420" step="20" value="180" />
            <span id="speedText">180ms</span>
          </div>
          <button id="toggle">暂停</button>
        </div>
        <pre class="code">grid: 3 columns x 2 rows
frame size: 512 x 512
playback: change background-position</pre>
      </article>

      <article class="card sheet-card">
        <h2>原始 6 帧图</h2>
        <p>左上到右下依次播放：睁眼尾巴摆动，随后半闭、闭眼、半睁，形成一次眨眼。</p>
        <img class="sheet-img" src="./black-cat-sprite-grid.png" alt="black cat sprite sheet" />
      </article>
    </section>
  </main>

  <script>
    const frames = [
      { col: 0, row: 0, pose: "eyes open, tail right" },
      { col: 1, row: 0, pose: "eyes open, tail left" },
      { col: 2, row: 0, pose: "eyes open, tail right" },
      { col: 0, row: 1, pose: "eyes half closed" },
      { col: 1, row: 1, pose: "eyes closed blink" },
      { col: 2, row: 1, pose: "eyes half open" }
    ];

    const sprite = document.getElementById("sprite");
    const frameText = document.getElementById("frameText");
    const poseText = document.getElementById("poseText");
    const speed = document.getElementById("speed");
    const speedText = document.getElementById("speedText");
    const toggle = document.getElementById("toggle");

    let index = 0;
    let timer = null;
    let running = true;

    function render() {
      const frame = frames[index];
      sprite.style.backgroundPosition = `${frame.col * 50}% ${frame.row * 100}%`;
      frameText.textContent = `frame: ${index + 1} / ${frames.length}`;
      poseText.textContent = frame.pose;
    }

    function start() {
      clearInterval(timer);
      timer = setInterval(() => {
        index = (index + 1) % frames.length;
        render();
      }, Number(speed.value));
    }

    speed.addEventListener("input", () => {
      speedText.textContent = `${speed.value}ms`;
      if (running) start();
    });

    toggle.addEventListener("click", () => {
      running = !running;
      toggle.textContent = running ? "暂停" : "播放";
      if (running) start();
      else clearInterval(timer);
    });

    render();
    start();
  </script>
</body>
</html>
