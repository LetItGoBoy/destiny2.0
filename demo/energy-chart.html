<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>能量命盘 · 演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --mu:   #35C07A;  /* 木 */
    --huo:  #FF6B4A;  /* 火 */
    --tu:   #E9B14C;  /* 土 */
    --jin:  #D7DCE0;  /* 金 */
    --shui: #4F9BF0;  /* 水 */
    --ink:  #EDE9FB;
    --ink2: #A79FC8;
    --ink3: #6E6790;
  }
  html, body {
    background: radial-gradient(120% 90% at 50% 0%, #16112B 0%, #0B0817 55%, #060410 100%);
    color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100%;
    overflow-x: hidden;
  }
  body { max-width: 440px; margin: 0 auto; padding: 28px 22px 60px; position: relative; }

  /* 星点背景 */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%;
          background: #fff; opacity: .25; animation: twinkle 4s infinite ease-in-out; }
  @keyframes twinkle { 0%,100%{opacity:.12} 50%{opacity:.5} }

  .wrap { position: relative; z-index: 1; }

  /* 头部 */
  .head { text-align: center; margin-bottom: 26px; opacity: 0; animation: fadeIn .8s .1s forwards; }
  .head .name { font-size: 15px; letter-spacing: 4px; color: var(--ink2); }
  .head .bazi { font-size: 22px; letter-spacing: 8px; margin-top: 8px; color: var(--ink);
                font-weight: 600; text-shadow: 0 0 18px rgba(157,120,248,.4); }
  .head .strength { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px;
                    font-size: 12px; color: var(--ink2); }
  .sbar { width: 120px; height: 6px; border-radius: 6px; overflow: hidden;
          background: linear-gradient(90deg,#C9508A,#F285AE); }
  .sbar > i { display:block; height:100%; width:0; border-radius:6px;
              background: linear-gradient(90deg,#6C4BD9,#9D78F8);
              transition: width 1.4s 1.2s cubic-bezier(.2,.7,.2,1); }
  .stag { color:#B79BFF; font-weight:600; }

  /* 命盘网格 */
  .grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-bottom: 8px; }
  .colhd { text-align:center; font-size:11px; letter-spacing:3px; color:var(--ink3);
           opacity:0; animation: fadeIn .6s forwards; }
  .cell {
    position: relative; aspect-ratio: 1 / 1.1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; border-radius: 16px;
    background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.04);
    opacity: 0; transform: scale(.5);
  }
  .cell.lit { animation: ignite .9s cubic-bezier(.18,.9,.25,1) forwards; }
  @keyframes ignite { 0%{opacity:0;transform:scale(.5)} 60%{opacity:1} 100%{opacity:1;transform:scale(1)} }

  /* 辉光球 */
  .orb {
    position: absolute; border-radius: 50%; filter: blur(8px);
    opacity: .85; animation: breathe var(--bd,4s) ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform: scale(1);    opacity: var(--ob,.7); }
    50%     { transform: scale(var(--bs,1.08)); opacity: calc(var(--ob,.7) + .18); }
  }
  .ch {
    position: relative; z-index: 2; font-weight: 700; line-height: 1;
    font-family: "STKaiti","KaiTi","PingFang SC",serif;
  }
  .god { position: relative; z-index: 2; margin-top: 7px; font-size: 11px; color: var(--ink2);
         letter-spacing: 1px; opacity: .85; }
  /* 日主标记 */
  .cell.day::after {
    content: "日主"; position: absolute; top: 6px; right: 7px; z-index: 3;
    font-size: 9px; letter-spacing: 1px; color: #2A2140;
    background: linear-gradient(135deg,#F4D98B,#D6A93F); padding: 1px 6px; border-radius: 6px;
  }
  .cell.day { box-shadow: inset 0 0 0 1.5px rgba(244,217,139,.55); }

  /* 气感词浮层 */
  .qi { position:absolute; bottom:7px; z-index:3; font-size:9px; letter-spacing:1px;
        color: var(--ink3); opacity:0; transition: opacity .3s; }
  .cell.show .qi { opacity:.9; }

  /* 十神能量榜 */
  .rank { margin-top: 32px; opacity:0; animation: fadeIn .8s 1s forwards; }
  .rank h3 { font-size: 13px; letter-spacing: 3px; color: var(--ink2); font-weight: 500;
             margin-bottom: 16px; text-align:center; }
  .row { display:flex; align-items:center; gap:10px; margin-bottom: 13px; }
  .row .nm { width: 40px; font-size:13px; color:var(--ink); letter-spacing:1px; flex-shrink:0; }
  .track { flex:1; height: 14px; border-radius: 8px; background: rgba(255,255,255,.05);
           overflow:hidden; position:relative; }
  .fill { height:100%; width:0; border-radius:8px; transition: width 1.3s cubic-bezier(.2,.7,.2,1);
          box-shadow: 0 0 12px currentColor; }
  .row .qg { width: 34px; font-size:10px; color:var(--ink3); flex-shrink:0; text-align:right; }

  .tip { text-align:center; margin-top:28px; font-size:11px; color:var(--ink3); letter-spacing:1px; }
  @keyframes fadeIn { to{opacity:1} }
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="wrap">
  <div class="head">
    <div class="name">命 主 · 己 土</div>
    <div class="bazi">戊辰 壬戌 己未 乙丑</div>
    <div class="strength">
      <span>生扶</span>
      <span class="sbar"><i id="sfill"></i></span>
      <span class="stag">日主身强</span>
    </div>
  </div>

  <div class="grid" id="colhds"></div>
  <div class="grid" id="grid"></div>

  <div class="rank">
    <h3>十 神 能 量</h3>
    <div id="rows"></div>
  </div>

  <div class="tip">轻触任意一字，查看其十神与气感</div>
</div>

<script>
/* ===== 数据（来自真实量化终值，前端只拿到"能量值"，不含任何公式） ===== */
var WX = { 木:'mu', 火:'huo', 土:'tu', 金:'jin', 水:'shui' };
var COL = { mu:'#35C07A', huo:'#FF6B4A', tu:'#E9B14C', jin:'#D7DCE0', shui:'#4F9BF0' };

// 八格：天干一行、地支一行（地支能量为藏干合计，十神取本气）
var cells = [
  // 年              月               日                时
  {c:'戊',wx:'土',god:'劫财',e:1.523},
  {c:'壬',wx:'水',god:'正财',e:0.584},
  {c:'己',wx:'土',god:'日主',e:1.643,day:true},
  {c:'乙',wx:'木',god:'七杀',e:0.603},
  {c:'辰',wx:'土',god:'劫财',e:0.985},
  {c:'戌',wx:'土',god:'劫财',e:1.850},
  {c:'未',wx:'土',god:'比肩',e:1.330},
  {c:'丑',wx:'土',god:'比肩',e:0.920},
];

var ranks = [
  {nm:'劫财',wx:'土',e:3.263},
  {nm:'比肩',wx:'土',e:1.410},
  {nm:'七杀',wx:'木',e:1.021},
  {nm:'食神',wx:'金',e:0.605},
  {nm:'正财',wx:'水',e:0.584},
  {nm:'偏印',wx:'火',e:0.557},
  {nm:'偏财',wx:'水',e:0.355},
];

/* ===== 归一化：面积感知（开方），保留弱字最低亮度 ===== */
var maxE = Math.max.apply(null, cells.map(function(x){return x.e;}));
function tier(r){
  if(r>=0.8) return '鼎盛';
  if(r>=0.6) return '充盈';
  if(r>=0.4) return '平稳';
  if(r>=0.2) return '微弱';
  return '将熄';
}

/* 星点 */
var st = document.getElementById('stars'), sh='';
for(var i=0;i<40;i++){
  sh += '<div class="star" style="left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;'+
        'animation-delay:'+(Math.random()*4)+'s"></div>';
}
st.innerHTML = sh;

/* 列头 */
document.getElementById('colhds').innerHTML =
  ['年','月','日','时'].map(function(t,i){
    return '<div class="colhd" style="animation-delay:'+(0.2+i*0.1)+'s">'+t+'</div>';
  }).join('');

/* 命盘格子 */
var grid = document.getElementById('grid'), html='';
cells.forEach(function(it,idx){
  var r = it.e/maxE;
  var sq = Math.sqrt(r);                       // 面积感知
  var orb = 34 + sq*58;                        // 辉光直径 px
  var fz  = 30 + sq*26;                        // 字号 px
  var ob  = 0.30 + sq*0.55;                    // 辉光基础不透明度
  var bs  = 1.04 + sq*0.10;                    // 呼吸幅度
  var bd  = (5.2 - sq*1.8).toFixed(2)+'s';     // 呼吸周期（越强越沉缓）
  var col = COL[WX[it.wx]];
  var col30 = col + '4d';
  html += '<div class="cell '+(it.day?'day':'')+'" data-i="'+idx+'">'+
    '<div class="orb" style="width:'+orb+'px;height:'+orb+'px;'+
      'background: radial-gradient(circle, '+col+' 0%, '+col30+' 45%, transparent 72%);'+
      '--ob:'+ob.toFixed(2)+';--bs:'+bs.toFixed(2)+';--bd:'+bd+'"></div>'+
    '<div class="ch" style="font-size:'+fz.toFixed(0)+'px;color:'+col+';'+
      'text-shadow:0 0 '+(8+sq*16).toFixed(0)+'px '+col+'">'+it.c+'</div>'+
    '<div class="god">'+it.god+'</div>'+
    '<div class="qi">气'+tier(r)+'</div>'+
  '</div>';
});
grid.innerHTML = html;

/* 逐字点亮（按柱：年干年支→月干月支…） */
var order = [0,4,1,5,2,6,3,7];
var nodes = grid.querySelectorAll('.cell');
order.forEach(function(idx,k){
  setTimeout(function(){ nodes[idx].classList.add('lit'); }, 300 + k*160);
});

/* 点击展开气感 */
grid.addEventListener('click', function(e){
  var cell = e.target.closest('.cell'); if(!cell) return;
  cell.classList.toggle('show');
});

/* 十神能量榜 */
var maxR = Math.max.apply(null, ranks.map(function(x){return x.e;}));
document.getElementById('rows').innerHTML = ranks.map(function(it){
  var col = COL[WX[it.wx]];
  return '<div class="row">'+
    '<span class="nm">'+it.nm+'</span>'+
    '<span class="track"><span class="fill" data-w="'+(it.e/maxR*100).toFixed(0)+'" '+
      'style="background:'+col+';color:'+col+'"></span></span>'+
    '<span class="qg">'+tier(it.e/maxR)+'</span>'+
  '</div>';
}).join('');
setTimeout(function(){
  document.querySelectorAll('.fill').forEach(function(f){ f.style.width = f.dataset.w+'%'; });
  document.getElementById('sfill').style.width = '78%';
}, 1100);
</script>
</body>
</html>
