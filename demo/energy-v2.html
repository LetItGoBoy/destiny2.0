<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>能量命盘 · 三方案对比</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --mu:#2FB36F; --huo:#FF5A36; --tu:#EBA22F; --jin:#C9D2DB; --shui:#3D8BF5;
    --ink:#F0ECFB; --ink2:#9A92BE; --ink3:#655D86; --line:rgba(255,255,255,.08);
  }
  body{
    background:#0B0817; color:var(--ink); max-width:440px; margin:0 auto;
    padding:26px 20px 70px;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .hd{ text-align:center; margin-bottom:8px; }
  .hd .bazi{ font-size:20px; letter-spacing:7px; font-weight:600; }
  .hd .sub{ font-size:12px; color:var(--ink2); margin-top:6px; letter-spacing:2px; }

  .sec{ margin-top:38px; }
  .sec-t{ font-size:13px; letter-spacing:3px; color:var(--ink2); margin-bottom:4px; }
  .sec-d{ font-size:11px; color:var(--ink3); margin-bottom:20px; }
  .pl{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .pl-h{ text-align:center; font-size:11px; color:var(--ink3); letter-spacing:2px; margin-bottom:10px; }

  /* ===== 方法一 字号大小 ===== */
  .m1 .box{ height:104px; display:flex; flex-direction:column; align-items:center;
            justify-content:center; gap:4px; border-radius:14px;
            background:rgba(255,255,255,.03); border:1px solid var(--line); }
  .m1 .c{ font-weight:800; line-height:1; font-family:"STKaiti","KaiTi",serif;
          transition:font-size 1s cubic-bezier(.2,.7,.2,1); }
  .m1 .g{ font-size:10px; color:var(--ink3); }

  /* ===== 方法二 能量柱 ===== */
  .m2 .col{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
            height:200px; }
  .m2 .c{ font-size:24px; font-weight:800; font-family:"STKaiti","KaiTi",serif; margin-bottom:6px; }
  .m2 .bar{ width:30px; border-radius:8px 8px 3px 3px; height:0;
            transition:height 1.1s cubic-bezier(.2,.7,.2,1); box-shadow:0 0 1px rgba(0,0,0,.3); }
  .m2 .g{ font-size:10px; color:var(--ink3); margin-top:7px; }

  /* ===== 方法三 充能水位 ===== */
  .m3 .box{ position:relative; height:96px; border-radius:14px; overflow:hidden;
            border:1px solid var(--line); background:rgba(255,255,255,.03);
            display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .m3 .fill{ position:absolute; left:0; right:0; bottom:0; height:0;
             transition:height 1.2s cubic-bezier(.2,.7,.2,1); opacity:.9; }
  .m3 .c{ position:relative; z-index:2; font-size:30px; font-weight:800;
          font-family:"STKaiti","KaiTi",serif; line-height:1; }
  .m3 .g{ position:relative; z-index:2; font-size:10px; color:var(--ink); opacity:.85; margin-top:4px; }

  .day{ box-shadow:inset 0 0 0 1.5px rgba(244,217,139,.6)!important; }
  .day-tag{ position:absolute; top:5px; right:6px; z-index:3; font-size:8px; color:#241c38;
            background:linear-gradient(135deg,#F4D98B,#D6A93F); padding:1px 5px; border-radius:5px; }
</style>
</head>
<body>
  <div class="hd">
    <div class="bazi">戊辰 壬戌 己未 乙丑</div>
    <div class="sub">命主 · 己土　|　同一盘 · 三种表达方式</div>
  </div>

  <!-- 方法一 -->
  <div class="sec m1">
    <div class="sec-t">方法一 · 字号大小</div>
    <div class="sec-d">能量越大，字越大（最旺约为最弱的 4 倍）</div>
    <div class="pl" id="m1h"></div>
    <div class="pl" id="m1" style="margin-top:10px"></div>
  </div>

  <!-- 方法二 -->
  <div class="sec m2">
    <div class="sec-t">方法二 · 能量柱（天际线）</div>
    <div class="sec-d">每个字站在柱子上，柱高 = 能量，高矮一眼可比</div>
    <div class="pl" id="m2h"></div>
    <div class="pl" id="m2" style="margin-top:6px"></div>
  </div>

  <!-- 方法三 -->
  <div class="sec m3">
    <div class="sec-t">方法三 · 充能水位</div>
    <div class="sec-d">格子像电池充能，水位 = 能量，满格 vs 空格</div>
    <div class="pl" id="m3h"></div>
    <div class="pl" id="m3" style="margin-top:10px"></div>
  </div>

<script>
var WX={木:'mu',火:'huo',土:'tu',金:'jin',水:'shui'};
var COL={mu:'#2FB36F',huo:'#FF5A36',tu:'#EBA22F',jin:'#C9D2DB',shui:'#3D8BF5'};

// 8 字（天干一行、地支一行，按 年月日时）
var gan=[
  {c:'戊',wx:'土',god:'劫财',e:1.523},
  {c:'壬',wx:'水',god:'正财',e:0.584},
  {c:'己',wx:'土',god:'日主',e:1.643,day:true},
  {c:'乙',wx:'木',god:'七杀',e:0.603},
];
var zhi=[
  {c:'辰',wx:'土',god:'劫财',e:0.985},
  {c:'戌',wx:'土',god:'劫财',e:1.850},
  {c:'未',wx:'土',god:'比肩',e:1.330},
  {c:'丑',wx:'土',god:'比肩',e:0.920},
];
var all=gan.concat(zhi);
var maxE=Math.max.apply(null,all.map(function(x){return x.e}));
function col(x){return COL[WX[x.wx]];}

['年','月','日','时'].forEach(function(t){
  ['m1h','m2h','m3h'].forEach(function(id){
    document.getElementById(id).innerHTML+='<div class="pl-h">'+t+'</div>';
  });
});

/* 方法一：字号 16~68px */
function m1cell(x){
  var r=x.e/maxE, fz=16+r*52;
  return '<div class="box '+(x.day?'day':'')+'" style="position:relative">'+
    (x.day?'<div class="day-tag">日主</div>':'')+
    '<div class="c" data-fz="'+fz.toFixed(0)+'" style="color:'+col(x)+'">'+x.c+'</div>'+
    '<div class="g">'+x.god+'</div></div>';
}
document.getElementById('m1').innerHTML=gan.map(m1cell).join('')+zhi.map(m1cell).join('');

/* 方法二：柱高 10~170px */
function m2cell(x){
  var r=x.e/maxE, h=10+r*160;
  return '<div class="col">'+
    '<div class="c" style="color:'+col(x)+'">'+x.c+'</div>'+
    '<div class="bar" data-h="'+h.toFixed(0)+'" style="background:'+col(x)+'"></div>'+
    '<div class="g">'+x.god+'</div></div>';
}
document.getElementById('m2').innerHTML=gan.map(m2cell).join('')+zhi.map(m2cell).join('');

/* 方法三：水位 6~100% */
function m3cell(x){
  var r=x.e/maxE, h=6+r*94, c=col(x);
  return '<div class="box '+(x.day?'day':'')+'">'+
    (x.day?'<div class="day-tag">日主</div>':'')+
    '<div class="fill" data-h="'+h.toFixed(0)+'" style="background:linear-gradient(0deg,'+c+','+c+'88)"></div>'+
    '<div class="c">'+x.c+'</div><div class="g">'+x.god+'</div></div>';
}
document.getElementById('m3').innerHTML=gan.map(m3cell).join('')+zhi.map(m3cell).join('');

/* 入场动画 */
setTimeout(function(){
  document.querySelectorAll('.m1 .c').forEach(function(e){e.style.fontSize=e.dataset.fz+'px';});
  document.querySelectorAll('.m2 .bar').forEach(function(e){e.style.height=e.dataset.h+'px';});
  document.querySelectorAll('.m3 .fill').forEach(function(e){e.style.height=e.dataset.h+'%';});
},150);
</script>
</body>
</html>
