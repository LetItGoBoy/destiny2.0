<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>四阶段心性手风琴 Demo</title>
  <style>
    :root {
      --ink: #172033;
      --muted: #687386;
      --line: rgba(23, 32, 51, 0.12);
      --paper: #f6f3ec;
      --panel: rgba(255, 255, 255, 0.88);
      --red: #d95f62;
      --blue: #4a73b8;
      --gold: #d9a21b;
      --green: #267870;
      --shadow: 0 18px 48px rgba(21, 28, 45, 0.11);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 8% 8%, rgba(217, 162, 27, 0.16), transparent 28%),
        radial-gradient(circle at 88% 12%, rgba(38, 120, 112, 0.12), transparent 30%),
        linear-gradient(135deg, #f7f4ed 0%, #edf4f2 48%, #f4f0f7 100%);
    }

    .page {
      width: min(1040px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 28px 0 44px;
    }

    .hero {
      margin-bottom: 18px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 18px;
      align-items: end;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 52px);
      line-height: 1.04;
      font-weight: 780;
      letter-spacing: 0;
    }

    .sub {
      margin: 0;
      max-width: 690px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .mode-card {
      width: 280px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .mode-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .mode-row:last-child { margin-bottom: 0; }
    .mode-row b {
      color: var(--ink);
      font-size: 18px;
    }

    .accordion {
      display: grid;
      gap: 12px;
    }

    .acc-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 14px 36px rgba(21, 28, 45, 0.08);
    }

    .acc-btn {
      width: 100%;
      min-height: 76px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      padding: 14px 16px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: center;
      text-align: left;
      font: inherit;
    }

    .acc-index {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--ink);
      font-weight: 800;
      font-size: 13px;
    }

    .acc-item[data-kind="luck"] .acc-index {
      color: #4d3300;
      background: linear-gradient(145deg, #ffe19a, var(--gold));
    }

    .acc-main {
      min-width: 0;
      display: grid;
      gap: 5px;
    }

    .acc-title {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: baseline;
    }

    .acc-title b {
      font-size: 22px;
      line-height: 1.12;
    }

    .acc-title span {
      color: var(--muted);
      font-size: 13px;
    }

    .acc-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      border: 1px solid rgba(23, 32, 51, 0.1);
      background: rgba(23, 32, 51, 0.045);
      color: #4b5668;
      font-weight: 700;
    }

    .chip.gold {
      color: #8a6100;
      border-color: rgba(217, 162, 27, 0.28);
      background: rgba(217, 162, 27, 0.13);
    }

    .chev {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.62);
      transition: transform .22s ease, color .22s ease, background .22s ease;
    }

    .acc-item.open .chev {
      transform: rotate(180deg);
      color: #fff;
      background: var(--ink);
    }

    .acc-body {
      display: none;
      border-top: 1px solid rgba(23, 32, 51, 0.08);
      padding: 16px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.62)),
        rgba(255, 255, 255, 0.74);
    }

    .acc-item.open .acc-body { display: block; }

    .section-note {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    .two-col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .trait-card {
      min-width: 0;
      border: 1px solid rgba(23, 32, 51, 0.09);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.8);
      overflow: hidden;
    }

    .trait-head {
      padding: 15px 15px 10px;
      border-bottom: 1px solid rgba(23, 32, 51, 0.07);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .trait-kicker {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .trait-name {
      margin: 0;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 25px;
      line-height: 1.12;
    }

    .trait-name small {
      color: #8a6100;
      font-size: 12px;
      font-weight: 800;
      background: rgba(217, 162, 27, 0.13);
      border: 1px solid rgba(217, 162, 27, 0.28);
      border-radius: 999px;
      padding: 4px 8px;
    }

    .mood {
      flex: 0 0 auto;
      color: #8a6100;
      background: rgba(217, 162, 27, 0.12);
      border: 1px solid rgba(217, 162, 27, 0.34);
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 800;
    }

    .desc {
      padding: 12px 15px 0;
      margin: 0;
      color: #3f485a;
      font-size: 14px;
      line-height: 1.75;
    }

    .sliders {
      padding: 12px 15px 0;
      display: grid;
      gap: 8px;
    }

    .slider-row {
      display: grid;
      grid-template-columns: 64px 1fr 42px;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .slider-row.flow { color: #8a6100; }

    .track {
      height: 8px;
      position: relative;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(217, 95, 98, .34), rgba(23, 32, 51, .11) 50%, rgba(74, 115, 184, .34));
    }

    .slider-row.flow .track {
      background: linear-gradient(90deg, rgba(217, 162, 27, .42), rgba(23, 32, 51, .10) 50%, rgba(217, 162, 27, .42));
    }

    .thumb {
      position: absolute;
      top: 50%;
      left: var(--p);
      width: 16px;
      height: 16px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 3px solid var(--ink);
      background: #fff;
      box-shadow: 0 6px 14px rgba(23, 32, 51, .16);
    }

    .slider-row.flow .thumb { border-color: var(--gold); }

    .bubble-field {
      position: relative;
      height: 300px;
      margin: 10px 10px 12px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid rgba(23, 32, 51, 0.07);
      background:
        linear-gradient(180deg, rgba(217, 95, 98, 0.07), transparent 44%),
        linear-gradient(0deg, rgba(74, 115, 184, 0.08), transparent 48%),
        rgba(247, 249, 250, 0.72);
    }

    .axis {
      position: absolute;
      left: 12px;
      right: 12px;
      top: 50%;
      height: 1px;
      background: rgba(23, 32, 51, 0.08);
    }

    .axis::before,
    .axis::after {
      position: absolute;
      top: -10px;
      color: rgba(23, 32, 51, 0.32);
      font-size: 10px;
      font-weight: 700;
    }

    .axis::before { content: "顺"; left: 0; }
    .axis::after { content: "偏"; right: 0; }

    .bubble {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--s);
      height: var(--s);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      display: grid;
      place-items: center;
      padding: 7px;
      text-align: center;
      color: #fff;
      font-size: clamp(10px, calc(var(--n) * .15px), 14px);
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: 0;
      box-shadow: inset 0 -8px 16px rgba(23, 32, 51, .14), 0 12px 24px rgba(23, 32, 51, .12);
      user-select: none;
    }

    .bubble.pro { background: linear-gradient(145deg, #ec8181, var(--red)); }
    .bubble.con { background: linear-gradient(145deg, #6f93d5, var(--blue)); }
    .bubble.neu { background: linear-gradient(145deg, #9aa4b2, #727d8f); }
    .bubble.flow {
      color: #3f2b00;
      background: linear-gradient(145deg, #ffe095, var(--gold));
      border: 2px solid rgba(255, 255, 255, .72);
      box-shadow: inset 0 -8px 16px rgba(138, 97, 0, .12), 0 14px 26px rgba(138, 97, 0, .2);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 0 15px 14px;
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .legend i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .legend .r { background: var(--red); }
    .legend .b { background: var(--blue); }
    .legend .g { background: #8d96a4; }
    .legend .y { background: var(--gold); }

    .luck-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .select-box {
      padding: 12px;
      border: 1px solid rgba(23, 32, 51, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
    }

    .select-title {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chips button {
      border: 1px solid rgba(23, 32, 51, 0.1);
      background: rgba(23, 32, 51, 0.045);
      color: #4b5668;
      border-radius: 999px;
      min-height: 30px;
      padding: 0 11px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
    }

    .chips button.on {
      color: #fff;
      background: var(--ink);
      border-color: var(--ink);
    }

    .year-stepper {
      display: grid;
      grid-template-columns: 34px 1fr 34px;
      gap: 8px;
      align-items: center;
    }

    .year-stepper button {
      height: 34px;
      border: 1px solid rgba(23, 32, 51, 0.1);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .year-box {
      height: 34px;
      border-radius: 999px;
      background: rgba(217, 162, 27, 0.13);
      border: 1px solid rgba(217, 162, 27, 0.28);
      color: #8a6100;
      display: grid;
      place-items: center;
      font-weight: 850;
      font-size: 14px;
    }

    @media (max-width: 820px) {
      .hero { grid-template-columns: 1fr; }
      .mode-card { width: 100%; }
      .two-col, .luck-controls { grid-template-columns: 1fr; }
    }

    @media (max-width: 520px) {
      .page { width: min(100vw - 18px, 1040px); padding-top: 18px; }
      .acc-btn {
        grid-template-columns: auto 1fr auto;
        gap: 10px;
        padding: 13px 12px;
      }
      .acc-index {
        width: 36px;
        height: 36px;
      }
      .acc-title b { font-size: 20px; }
      .acc-body { padding: 12px; }
      .trait-head { flex-direction: column; }
      .slider-row { grid-template-columns: 56px 1fr 38px; }
      .bubble-field { height: 286px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div>
        <h1>四阶段心性 Demo</h1>
        <p class="sub">入口不放在顶部，而是像目录一样竖着往下排。点开一个阶段，就在下面展开该阶段的外显心性和内心心性；再点同一项会收起，点另一个阶段会切换展开。</p>
      </div>
      <aside class="mode-card">
        <div class="mode-row"><span>当前展开</span><b id="openName">青年</b></div>
        <div class="mode-row"><span>交互方式</span><span class="chip gold">竖向展开</span></div>
      </aside>
    </section>

    <section class="accordion" id="accordion"></section>
  </main>

  <script>
    const words = {
      "比肩": {
        desc: "这个阶段容易带着一股自己来的劲，遇到事不太愿意先低头，也不太喜欢被人安排。顺的时候很能坚持，偏的时候容易硬扛。",
        pro: ["有毅力", "不服输", "勤奋努力", "独立", "执行力强"],
        neu: ["烂好人", "易吃亏", "自尊心强"],
        con: ["爱面子", "犟种", "死板"]
      },
      "劫财": {
        desc: "这一层外放、热、敢争，容易被同伴和竞争点燃。顺的时候很有人气，偏的时候容易上头或边界不清。",
        pro: ["自信", "豪爽", "热情", "勇于竞争", "讲义气"],
        neu: ["自尊心强", "不会拒绝"],
        con: ["冲动", "霸道", "自我", "斗争", "攀比", "破财"]
      },
      "正财": {
        desc: "这一层会让人更重实际、秩序和结果，愿意把日子过稳。顺的时候可靠踏实，偏的时候容易紧、计较或被琐事拖住。",
        pro: ["本分", "勤俭", "细节控", "务实", "专一"],
        neu: ["劳碌命"],
        con: ["保守", "脾气爆", "敏感", "计较"]
      },
      "偏财": {
        desc: "这一层对机会、关系和资源更敏感，喜欢灵活处理问题。顺的时候大方活络，偏的时候容易分心、花出去或边界松。",
        pro: ["大方", "豁达", "灵活", "热情", "情商高"],
        neu: [],
        con: ["拜金", "多情", "耐心不足", "边界松"]
      },
      "正官": {
        desc: "这一层重视秩序、评价和体面，希望自己做得稳、做得对。顺的时候自律可靠，偏的时候容易多虑和怕错。",
        pro: ["自律", "稳健", "负责", "重信誉", "守规矩"],
        neu: [],
        con: ["多虑", "压力大", "在意评价", "胆小"]
      },
      "七杀": {
        desc: "这一层带来警觉、压力感和目标感，遇事反应快，也容易先进入防御。顺的时候很果断，偏的时候紧绷急躁。",
        pro: ["果断", "警觉", "权谋", "有手段", "伶俐"],
        neu: [],
        con: ["紧绷", "急躁", "好斗", "多虑", "赌性大"]
      },
      "食神": {
        desc: "这一层更柔软、细腻，也更需要舒服和松弛。顺的时候有人缘、有温度，偏的时候容易幻想、躺平或放纵。",
        pro: ["温和", "细腻", "宽容", "善良", "松弛", "人文情怀"],
        neu: ["人缘好"],
        con: ["爱幻想", "好逸恶劳", "躺平", "佛系", "放纵"]
      },
      "伤官": {
        desc: "这一层表达欲、悟性和锋芒更强，不喜欢被死管。顺的时候很有才气和创新力，偏的时候容易不服管、没耐性。",
        pro: ["聪明", "悟性高", "表现欲", "才气", "有魅力", "创新力强"],
        neu: ["完美主义", "爱自由"],
        con: ["持才傲物", "不服管束", "没耐性", "放纵"]
      },
      "正印": {
        desc: "这一层更需要安全感、照顾感和精神支撑。顺的时候平和有智慧，偏的时候容易行动慢、依赖或不想改变。",
        pro: ["仁慈", "平和", "有爱心", "有智慧", "有修养"],
        neu: ["注重内涵"],
        con: ["行动力差", "懒", "依赖性强", "优柔寡断", "不思进取"]
      },
      "偏印": {
        desc: "这一层更专注、尖锐和有洞察，容易走向独特兴趣。顺的时候看问题很深，偏的时候容易孤僻、悲观或说话带刺。",
        pro: ["专注", "精辟", "批判性强", "看透本质", "悟性强"],
        neu: ["心理学家"],
        con: ["孤僻", "悲观", "说话带刺", "太小众"]
      }
    };

    const stages = [
      { key: "young", title: "少年", subtitle: "先天底色", note: "少年阶段看最早形成的性格底色。它不只属于小时候，也会像底色一样被带到人生后面。", outer: "比肩", inner: "正印", outerSlider: 42, innerSlider: 39 },
      { key: "growth", title: "青年", subtitle: "成长表达", note: "青年阶段看一个人如何向外表达、竞争、试探边界，也看内心最容易被什么推动。", outer: "伤官", inner: "七杀", outerSlider: 61, innerSlider: 64 },
      { key: "middle", title: "中年", subtitle: "整体心性", note: "中年阶段更贴近真实关系和长期选择。这里不再拆外层表现，只看这一阶段真正稳定下来的整体心性。", outer: null, inner: "偏财", outerSlider: 45, innerSlider: 53 },
      { key: "later", title: "晚年", subtitle: "后期状态", note: "晚年阶段看后半程更自然流露的状态，也看一个人最终更愿意怎样安排生活。", outer: "正财", inner: "食神", outerSlider: 47, innerSlider: 44 }
    ];

    const flowCycleOuter = ["劫财", "食神", "伤官", "正财", "偏财", "正官", "七杀", "正印", "偏印", "比肩"];
    const flowCycleInner = ["正印", "偏印", "比肩", "劫财", "食神", "伤官", "正财", "偏财", "正官", "七杀"];
    const flowDir = { 比肩: "+", 劫财: "-", 食神: "+", 伤官: "-", 正财: "+", 偏财: "0", 正官: "+", 七杀: "-", 正印: "+", 偏印: "-" };

    let openKey = "growth";
    let luckStage = 1;
    let luckYear = 2026;

    const $ = (id) => document.getElementById(id);

    function mood(slider) {
      if (slider <= 44) return "偏喜";
      if (slider >= 56) return "偏忌";
      return "中性";
    }

    function flowGod(year, layer) {
      const idx = Math.abs(year - 2005) % 10;
      return layer === "outer" ? flowCycleOuter[idx] : flowCycleInner[idx];
    }

    function flowSlider(god, year) {
      const energy = 5 + ((year - 2005) % 7);
      const mag = Math.min(24, Math.max(8, Math.round(energy * 1.8)));
      const d = flowDir[god] || "0";
      if (d === "+") return 50 - mag;
      if (d === "-") return 50 + mag;
      return 50;
    }

    function bubbleSize(kind, source, slider, index) {
      const lean = slider / 100;
      const bias = kind === "pro" ? (1 - lean) : kind === "con" ? lean : 0.52;
      const base = source === "flow" ? 44 : 49;
      const range = source === "flow" ? 34 : 40;
      const decay = index * (source === "flow" ? 4 : 5);
      return Math.max(source === "flow" ? 42 : 38, base + bias * range - decay);
    }

    function bubblePos(kind, source, slider, index) {
      const lean = slider / 100;
      const offset = [-8, 9, -2, 14, -14, 4][index % 6];
      if (source === "flow") {
        const x = 34 + lean * 32 + offset * 0.52;
        const yBase = kind === "pro" ? 27 : kind === "con" ? 66 : 50;
        const y = yBase + (lean - 0.5) * 18 + [0, 9, -7, 5, -4, 7][index % 6];
        return [x, y];
      }
      if (kind === "pro") return [24 + index * 12 + offset * 0.5, 25 + (index % 3) * 12];
      if (kind === "con") return [48 + index * 11 + offset * 0.6, 68 + (index % 3) * 10];
      return [35 + index * 20, 50 + (index % 2) * 8];
    }

    function bubbleHtml(baseGod, baseSlider, flowGodName, flowValue) {
      const items = [];
      if (baseGod) {
        const base = words[baseGod] || words["比肩"];
        base.pro.slice(0, 5).forEach((label, index) => items.push({ label, kind: "pro", source: "base", slider: baseSlider, index }));
        base.neu.slice(0, 3).forEach((label, index) => items.push({ label, kind: "neu", source: "base", slider: 50, index }));
        base.con.slice(0, 5).forEach((label, index) => items.push({ label, kind: "con", source: "base", slider: baseSlider, index }));
      }

      if (flowGodName) {
        const flow = words[flowGodName] || words["正官"];
        flow.pro.slice(0, 3).forEach((label, index) => items.push({ label, kind: "pro", source: "flow", slider: flowValue, index }));
        flow.con.slice(0, 3).forEach((label, index) => items.push({ label, kind: "con", source: "flow", slider: flowValue, index }));
      }

      return '<div class="bubble-field"><i class="axis"></i>' + items.map((item) => {
        const size = bubbleSize(item.kind, item.source, item.slider, item.index);
        const pos = bubblePos(item.kind, item.source, item.slider, item.index);
        const cls = item.source === "flow" ? "flow" : item.kind;
        return `<span class="bubble ${cls}" style="--x:${Math.max(10, Math.min(90, pos[0]))}%;--y:${Math.max(12, Math.min(88, pos[1]))}%;--s:${size}px;--n:${size}">${item.label}</span>`;
      }).join("") + '</div>';
    }

    function sliderHtml(label, value, flow) {
      return `<div class="slider-row ${flow ? "flow" : ""}">
        <span>${label}</span>
        <div class="track"><i class="thumb" style="--p:${value}%"></i></div>
        <span>${Math.round(value)}</span>
      </div>`;
    }

    function traitCard(layer, god, slider, flowGodName, flowValue) {
      const data = words[god] || words["比肩"];
      return `<article class="trait-card">
        <header class="trait-head">
          <div>
            <p class="trait-kicker">${layer}</p>
            <h3 class="trait-name"><span>${god}</span>${flowGodName ? `<small>${flowGodName}</small>` : ""}</h3>
          </div>
          <span class="mood">${mood(slider)}</span>
        </header>
        <p class="desc">${data.desc}</p>
        <div class="sliders">
          ${sliderHtml("本阶段", slider, false)}
          ${flowGodName ? sliderHtml("流动", flowValue, true) : ""}
        </div>
        ${bubbleHtml(god, slider, flowGodName, flowValue)}
        <div class="legend"><span><i class="r"></i>顺的一面</span><span><i class="g"></i>中性倾向</span><span><i class="b"></i>偏的一面</span>${flowGodName ? '<span><i class="y"></i>流动心性</span>' : ""}</div>
      </article>`;
    }

    function flowOnlyCard(layer, god, slider) {
      const data = words[god] || words["比肩"];
      return `<article class="trait-card">
        <header class="trait-head">
          <div>
            <p class="trait-kicker">${layer}</p>
            <h3 class="trait-name"><span>${god}</span><small>流动</small></h3>
          </div>
          <span class="mood">${mood(slider)}</span>
        </header>
        <p class="desc">${data.desc}</p>
        <div class="sliders">${sliderHtml("流动", slider, true)}</div>
        ${bubbleHtml(null, 50, god, slider)}
        <div class="legend"><span><i class="y"></i>流动心性</span></div>
      </article>`;
    }

    function stageBody(stage) {
      return `<p class="section-note">${stage.note}</p>
      <div class="two-col">
        ${stage.outer ? traitCard("外显心性", stage.outer, stage.outerSlider) : ""}
        ${traitCard(stage.key === "middle" ? "整体心性" : "内心心性", stage.inner, stage.innerSlider)}
      </div>`;
    }

    function luckBody() {
      const stage = stages[luckStage];
      const outerFlow = flowGod(luckYear, "outer");
      const innerFlow = flowGod(luckYear, "inner");
      const outerFlowValue = flowSlider(outerFlow, luckYear);
      const innerFlowValue = flowSlider(innerFlow, luckYear + 3);
      return `<p class="section-note">岁运是单独的流动心性入口。这里先选择要叠加到哪个人生阶段，再选择年份；金色泡泡直接混进该阶段的外显和内心星团里。</p>
      <div class="luck-controls">
        <div class="select-box">
          <p class="select-title">选择叠加阶段</p>
          <div class="chips">
            ${stages.map((s, i) => `<button type="button" class="${i === luckStage ? "on" : ""}" data-luck-stage="${i}">${s.title}</button>`).join("")}
          </div>
        </div>
        <div class="select-box">
          <p class="select-title">选择年份</p>
          <div class="year-stepper">
            <button type="button" data-year-step="-1">‹</button>
            <div class="year-box">${luckYear} · ${outerFlow}/${innerFlow}</div>
            <button type="button" data-year-step="1">›</button>
          </div>
        </div>
      </div>
      <div class="two-col">
        ${stage.key === "middle" ? flowOnlyCard(`${stage.title} · 流动外显`, outerFlow, outerFlowValue) : traitCard(`${stage.title} · 外显心性`, stage.outer, stage.outerSlider, outerFlow, outerFlowValue)}
        ${traitCard(stage.key === "middle" ? `${stage.title} · 整体心性` : `${stage.title} · 内心心性`, stage.inner, stage.innerSlider, innerFlow, innerFlowValue)}
      </div>`;
    }

    function itemHtml(item, index) {
      const isLuck = item.key === "luck";
      const open = openKey === item.key;
      const title = isLuck ? "岁运" : item.title;
      const subtitle = isLuck ? "流动心性" : item.subtitle;
      const summary = isLuck
        ? '<span class="chip gold">选择阶段</span><span class="chip gold">选择年份</span><span class="chip gold">金色泡泡混入</span>'
        : `<span class="chip">外显：${item.outer}</span><span class="chip">内心：${item.inner}</span>`;
      const body = isLuck ? luckBody() : stageBody(item);

      return `<article class="acc-item ${open ? "open" : ""}" data-key="${item.key}" data-kind="${isLuck ? "luck" : "stage"}">
        <button class="acc-btn" type="button" data-toggle="${item.key}">
          <span class="acc-index">${isLuck ? "流" : String(index + 1).padStart(2, "0")}</span>
          <span class="acc-main">
            <span class="acc-title"><b>${title}</b><span>${subtitle}</span></span>
            <span class="acc-summary">${summary}</span>
          </span>
          <span class="chev">⌄</span>
        </button>
        <div class="acc-body">${body}</div>
      </article>`;
    }

    function render() {
      const items = stages.concat([{ key: "luck" }]);
      $("accordion").innerHTML = items.map(itemHtml).join("");
      const openItem = items.find((x) => x.key === openKey);
      $("openName").textContent = openItem ? (openItem.key === "luck" ? "岁运" : openItem.title) : "未展开";

      document.querySelectorAll("[data-toggle]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const key = btn.getAttribute("data-toggle");
          openKey = openKey === key ? null : key;
          render();
        });
      });
      document.querySelectorAll("[data-luck-stage]").forEach((btn) => {
        btn.addEventListener("click", (event) => {
          event.stopPropagation();
          luckStage = Number(btn.getAttribute("data-luck-stage"));
          openKey = "luck";
          render();
        });
      });
      document.querySelectorAll("[data-year-step]").forEach((btn) => {
        btn.addEventListener("click", (event) => {
          event.stopPropagation();
          luckYear += Number(btn.getAttribute("data-year-step"));
          if (luckYear < 2005) luckYear = 2005;
          if (luckYear > 2085) luckYear = 2085;
          openKey = "luck";
          render();
        });
      });
    }

    render();
  </script>
</body>
</html>
