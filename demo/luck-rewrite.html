<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>岁运改写原局每个字的能量</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{ --mu:#2FB36F; --huo:#FF5A36; --tu:#E0A12A; --jin:#9AA6B2; --shui:#3D8BF5; }
  body{ background:radial-gradient(120% 90% at 50% 0%,#15102C 0%,#0B0817 60%,#060410 100%);
        color:#EDE9FB; max-width:440px; margin:0 auto; padding:24px 18px 50px;
        font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .hd{ text-align:center; } .hd .bz{ font-size:18px; letter-spacing:6px; font-weight:600; }
  .hd .s{ font-size:11px; color:#8c84ad; margin-top:6px; }
  .btns{ display:flex; gap:10px; margin:20px 0 6px; }
  .btn{ flex:1; text-align:center; padding:11px 0; border-radius:12px; font-size:13px;
        border:1px solid rgba(255,255,255,.12); color:#b9b2d8; background:rgba(255,255,255,.03); transition:.25s; }
  .btn.on{ color:#fff; border-color:transparent; }
  .btn.good.on{ background:linear-gradient(135deg,#3D8BF5,#2FB36F); }
  .btn.bad.on{ background:linear-gradient(135deg,#FF5A36,#E0A12A); }
  .guestbar{ text-align:center; font-size:12px; color:#9a92be; margin:14px 0 6px; }
  .guestbar b{ font-family:"STKaiti","KaiTi",serif; font-size:15px; }

  .lab{ font-size:11px; color:#7a719e; letter-spacing:2px; margin:20px 0 10px; }
  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .ph{ text-align:center; font-size:10px; color:#655d86; margin-bottom:6px; }
  .cell{ border-radius:13px; padding:10px 8px; background:rgba(255,255,255,.04);
         border:1px solid rgba(255,255,255,.07); text-align:center; }
  .ch{ font-size:26px; font-weight:800; font-family:"STKaiti","KaiTi",serif; line-height:1; }
  .gd{ font-size:9px; color:#8c84ad; margin:3px 0 8px; }
  .bar{ height:7px; border-radius:5px; background:rgba(255,255,255,.08); overflow:hidden; }
  .bar > i{ display:block; height:100%; width:0; border-radius:5px; transition:width .9s cubic-bezier(.2,.7,.2,1); }
  .dl{ font-size:11px; margin-top:6px; font-weight:700; min-height:15px; }
  .up{ color:#5BD08A; } .down{ color:#FF7A33; } .flat{ color:#655d86; }
</style>
</head>
<body>
  <div class="hd">
    <div class="bz">戊辰 壬戌 己未 乙丑</div>
    <div class="s">命主 · 己土　|　岁运逐字改写原局能量（不直接动 p）</div>
  </div>

  <div class="btns">
    <div class="btn good on" onclick="pick('good')">喜用运 · 甲子 癸卯</div>
    <div class="btn bad" onclick="pick('bad')">忌神运 · 戊午 丙午</div>
  </div>
  <div class="guestbar" id="gb"></div>

  <div class="lab">天干</div>
  <div class="grid" id="gh"></div>
  <div class="grid" id="ganRow" style="margin-top:6px"></div>
  <div class="lab">地支（藏干合计）</div>
  <div class="grid" id="zhiRow" style="margin-top:6px"></div>

<script>
var SHENG={木:'火',火:'土',土:'金',金:'水',水:'木'};
var KE={木:'土',土:'水',水:'火',火:'金',金:'木'};
var WX={木:'mu',火:'huo',土:'tu',金:'jin',水:'shui'};
var COL={mu:'#2FB36F',huo:'#FF5A36',tu:'#E0A12A',jin:'#9AA6B2',shui:'#3D8BF5'};
function c(x){return COL[WX[x]];}

// 原局：天干 + 各地支藏干
var gans=[
  {h:'年',ch:'戊',el:'土',gd:'劫财',v:1.523},
  {h:'月',ch:'壬',el:'水',gd:'正财',v:0.584},
  {h:'日',ch:'己',el:'土',gd:'日主',v:1.643},
  {h:'时',ch:'乙',el:'木',gd:'七杀',v:0.603},
];
var zhis=[
  {h:'年',ch:'辰',gd:'劫财',hid:[{el:'土',v:0.600},{el:'木',v:0.285},{el:'水',v:0.100}]},
  {h:'月',ch:'戌',gd:'劫财',hid:[{el:'土',v:1.140},{el:'金',v:0.510},{el:'火',v:0.200}]},
  {h:'日',ch:'未',gd:'比肩',hid:[{el:'土',v:0.840},{el:'火',v:0.357},{el:'木',v:0.133}]},
  {h:'时',ch:'丑',gd:'比肩',hid:[{el:'土',v:0.570},{el:'水',v:0.255},{el:'金',v:0.095}]},
];
var SC={
  good:{ label:'甲子 · 癸卯', actors:[{el:'木',f:0.7},{el:'水',f:1.3},{el:'水',f:0.9},{el:'木',f:0.9}],
         note:'木(官杀)·水(财) 来作用 → 喜用' },
  bad:{ label:'戊午 · 丙午', actors:[{el:'土',f:0.7},{el:'火',f:0.91},{el:'土',f:0.39},{el:'火',f:0.63},{el:'火',f:0.9},{el:'土',f:0.27}],
        note:'火(印)·土(比劫) 来作用 → 忌神' },
};
var DF=0.5, CAP=0.4;

// 岁运作用于单字，返回新能量
function affect(el, v, actors){
  var d=0;
  actors.forEach(function(a){
    if(SHENG[a.el]===el) d += 0.25*a.f*DF;        // 岁运生它
    else if(a.el===el)  d += 0.20*a.f*DF;         // 同类帮扶
    else if(KE[a.el]===el) d -= 0.25*a.f*DF;      // 岁运克它
    else if(SHENG[el]===a.el) d -= 0.15*v*DF;     // 它生岁运·泄
    else if(KE[el]===a.el)   d -= 0.05*v*DF;      // 它克岁运·耗
  });
  var cap=CAP*v; if(d>cap)d=cap; if(d<-cap)d=-cap;
  return Math.max(0.02, v+d);
}

var MAXV=2.1;
function cellHTML(ch,el,gd,v){
  return '<div class="cell"><div class="ch" style="color:'+c(el)+'">'+ch+'</div>'+
    '<div class="gd">'+gd+'</div>'+
    '<div class="bar"><i style="background:'+c(el)+'"></i></div>'+
    '<div class="dl flat">'+v.toFixed(2)+'</div></div>';
}
// 初始渲染
['gh'].forEach(function(){});
document.getElementById('gh').innerHTML=gans.map(function(g){return '<div class="ph">'+g.h+'</div>';}).join('');
document.getElementById('ganRow').innerHTML=gans.map(function(g){return cellHTML(g.ch,g.el,g.gd,g.v);}).join('');
document.getElementById('zhiRow').innerHTML=zhis.map(function(z){
  var sum=z.hid.reduce(function(s,h){return s+h.v;},0);
  return cellHTML(z.ch, z.hid[0].el, z.gd, sum);
}).join('');

function setCell(cells, idx, oldV, newV, el){
  var cell=cells[idx];
  cell.querySelector('i').style.width=Math.min(100,newV/MAXV*100)+'%';
  cell.querySelector('i').style.background=c(el);
  var d=newV-oldV, dl=cell.querySelector('.dl');
  if(Math.abs(d)<0.015){ dl.className='dl flat'; dl.textContent=newV.toFixed(2); }
  else if(d>0){ dl.className='dl up'; dl.textContent=newV.toFixed(2)+'  ↑+'+d.toFixed(2); }
  else { dl.className='dl down'; dl.textContent=newV.toFixed(2)+'  ↓'+d.toFixed(2); }
}

function pick(k){
  document.querySelectorAll('.btn').forEach(function(b){ b.classList.remove('on'); });
  document.querySelector('.btn.'+k).classList.add('on');
  var s=SC[k];
  document.getElementById('gb').innerHTML='岁运 <b>'+s.label+'</b>　'+s.note;
  var ganCells=document.getElementById('ganRow').children;
  var zhiCells=document.getElementById('zhiRow').children;
  gans.forEach(function(g,i){ setCell(ganCells,i,g.v,affect(g.el,g.v,s.actors),g.el); });
  zhis.forEach(function(z,i){
    var oldSum=0,newSum=0;
    z.hid.forEach(function(h){ oldSum+=h.v; newSum+=affect(h.el,h.v,s.actors); });
    setCell(zhiCells,i,oldSum,newSum,z.hid[0].el);
  });
}
// 先显示原局（无运），再可切换
setTimeout(function(){
  var ganCells=document.getElementById('ganRow').children, zhiCells=document.getElementById('zhiRow').children;
  gans.forEach(function(g,i){ ganCells[i].querySelector('i').style.width=Math.min(100,g.v/MAXV*100)+'%'; });
  zhis.forEach(function(z,i){ var s=z.hid.reduce(function(a,h){return a+h.v;},0);
    zhiCells[i].querySelector('i').style.width=Math.min(100,s/MAXV*100)+'%'; });
  setTimeout(function(){ pick('good'); }, 600);
},100);
</script>
</body>
</html>
