<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>岁运对原局能量的影响</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{ --mu:#2FB36F; --huo:#FF5A36; --tu:#E0A12A; --jin:#9AA6B2; --shui:#3D8BF5; }
  body{ background:radial-gradient(120% 90% at 50% 0%,#15102C 0%,#0B0817 60%,#060410 100%);
        color:#EDE9FB; max-width:440px; margin:0 auto; padding:24px 20px 50px;
        font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  .hd{ text-align:center; } .hd .bz{ font-size:18px; letter-spacing:6px; font-weight:600; }
  .hd .s{ font-size:11px; color:#8c84ad; margin-top:6px; letter-spacing:1px; }

  .btns{ display:flex; gap:10px; margin:22px 0 8px; }
  .btn{ flex:1; text-align:center; padding:11px 0; border-radius:12px; font-size:13px;
        border:1px solid rgba(255,255,255,.12); color:#b9b2d8; background:rgba(255,255,255,.03);
        transition:all .25s; }
  .btn.on{ color:#fff; border-color:transparent; }
  .btn.good.on{ background:linear-gradient(135deg,#3D8BF5,#2FB36F); }
  .btn.bad.on{ background:linear-gradient(135deg,#FF5A36,#E0A12A); }

  .lab{ font-size:11px; color:#7a719e; letter-spacing:2px; margin:24px 0 10px; }
  .pillars{ display:flex; gap:7px; }
  .pcol{ flex:1; text-align:center; }
  .ph{ font-size:10px; color:#655d86; margin-bottom:6px; }
  .pbox{ border-radius:12px; padding:9px 0; background:rgba(255,255,255,.04);
         border:1px solid rgba(255,255,255,.07); }
  .pbox.guest{ border:1px dashed rgba(255,255,255,.28); background:rgba(255,255,255,.015);
               opacity:0; transform:translateY(-8px); transition:all .5s; }
  .pbox.guest.show{ opacity:1; transform:translateY(0); }
  .pg{ font-size:24px; font-weight:800; font-family:"STKaiti","KaiTi",serif; line-height:1.25; }
  .pz{ font-size:24px; font-weight:800; font-family:"STKaiti","KaiTi",serif; line-height:1.25; }
  .pgd{ font-size:9px; color:#8c84ad; margin-top:3px; }

  .cmp{ margin-top:30px; }
  .barrow{ margin-bottom:18px; }
  .barlab{ display:flex; justify-content:space-between; font-size:12px; margin-bottom:7px; }
  .barlab .nm{ color:#b9b2d8; } .barlab .vv{ font-weight:700; }
  .bar{ height:20px; border-radius:10px; overflow:hidden;
        background:linear-gradient(90deg,#C9508A,#F285AE); position:relative; }
  .bar > i{ display:block; height:100%; width:0; border-radius:10px;
            background:linear-gradient(90deg,#6C4BD9,#9D78F8); transition:width 1s cubic-bezier(.2,.7,.2,1); }
  .legend2{ display:flex; justify-content:space-between; font-size:10px; color:#8c84ad; margin-top:5px; }

  .delta{ text-align:center; margin-top:14px; font-size:14px; }
  .delta b{ font-size:20px; }
  .verdict{ text-align:center; margin-top:10px; font-size:12px; color:#9a92be; line-height:1.7; }
</style>
</head>
<body>
  <div class="hd">
    <div class="bz">戊辰 壬戌 己未 乙丑</div>
    <div class="s">命主 · 己土　|　原局身强 78.2%　·　看岁运如何改写</div>
  </div>

  <div class="btns">
    <div class="btn good on" id="bGood" onclick="pick('good')">喜用运　甲子 · 癸卯</div>
    <div class="btn bad" id="bBad" onclick="pick('bad')">忌神运　戊午 · 丙午</div>
  </div>

  <div class="lab">原局四柱（体 · 固定）</div>
  <div class="pillars" id="natal"></div>

  <div class="lab">岁运（客 · 加入）</div>
  <div class="pillars" id="guest"></div>

  <div class="cmp">
    <div class="barrow">
      <div class="barlab"><span class="nm">原局（无岁运）</span><span class="vv" id="v0">78.2%</span></div>
      <div class="bar"><i id="b0"></i></div>
    </div>
    <div class="barrow">
      <div class="barlab"><span class="nm" id="nm1">加 甲子·癸卯</span><span class="vv" id="v1">—</span></div>
      <div class="bar"><i id="b1"></i></div>
      <div class="legend2"><span style="color:#9D78F8">生扶</span><span style="color:#F285AE">克泄耗</span></div>
    </div>
  </div>

  <div class="delta" id="delta"></div>
  <div class="verdict" id="verdict"></div>

<script>
var WX={木:'mu',火:'huo',土:'tu',金:'jin',水:'shui'};
var COL={mu:'#2FB36F',huo:'#FF5A36',tu:'#E0A12A',jin:'#9AA6B2',shui:'#3D8BF5'};
function c(x){return COL[WX[x]];}

var natal=[
  {h:'年',g:'戊',gx:'土',gd:'劫财',z:'辰',zx:'土',zd:'劫财'},
  {h:'月',g:'壬',gx:'水',gd:'正财',z:'戌',zx:'土',zd:'劫财'},
  {h:'日',g:'己',gx:'土',gd:'日主',z:'未',zx:'土',zd:'比肩'},
  {h:'时',g:'乙',gx:'木',gd:'七杀',z:'丑',zx:'土',zd:'比肩'},
];
document.getElementById('natal').innerHTML=natal.map(function(p){
  return '<div class="pcol"><div class="ph">'+p.h+'</div><div class="pbox">'+
    '<div class="pg" style="color:'+c(p.gx)+'">'+p.g+'</div>'+
    '<div class="pz" style="color:'+c(p.zx)+'">'+p.z+'</div>'+
    '<div class="pgd">'+p.gd+'</div></div></div>';
}).join('');

var SC={
  good:{ guest:[
      {h:'大运',g:'甲',gx:'木',z:'子',zx:'水',gd:'正官 偏财'},
      {h:'流年',g:'癸',gx:'水',z:'卯',zx:'木',gd:'偏财 七杀'}],
    same:9.21, diff:6.37, p:59.1, nm:'加 甲子·癸卯',
    vd:'财官木水齐来，泄克旺土 → 身强趋于中和，正中喜用，<b style="color:#5BD08A">吉运</b>。'},
  bad:{ guest:[
      {h:'大运',g:'戊',gx:'土',z:'午',zx:'火',gd:'劫财 偏印'},
      {h:'流年',g:'丙',gx:'火',z:'午',zx:'火',gd:'正印 偏印'}],
    same:14.91, diff:2.57, p:85.3, nm:'加 戊午·丙午',
    vd:'火土再增，旺土愈壅 → 身过强失衡，助了忌神，<b style="color:#FF7A33">凶运</b>。'}
};
var P0=78.2;

function pick(k){
  document.getElementById('bGood').classList.toggle('on',k==='good');
  document.getElementById('bBad').classList.toggle('on',k==='bad');
  var s=SC[k];
  // 岁运两柱
  var g=document.getElementById('guest');
  g.innerHTML=s.guest.map(function(p){
    return '<div class="pcol"><div class="ph">'+p.h+'</div><div class="pbox guest">'+
      '<div class="pg" style="color:'+c(p.gx)+'">'+p.g+'</div>'+
      '<div class="pz" style="color:'+c(p.zx)+'">'+p.z+'</div>'+
      '<div class="pgd">'+p.gd+'</div></div></div>';
  }).join('')+'<div class="pcol"></div><div class="pcol"></div>';
  setTimeout(function(){ g.querySelectorAll('.guest').forEach(function(e,i){
    setTimeout(function(){ e.classList.add('show'); }, i*150); }); },50);

  document.getElementById('nm1').textContent=s.nm;
  document.getElementById('v1').textContent=s.p.toFixed(1)+'%';
  document.getElementById('b0').style.width='0%';
  document.getElementById('b1').style.width='0%';
  setTimeout(function(){
    document.getElementById('b0').style.width=P0+'%';
    document.getElementById('b1').style.width=s.p+'%';
  },120);
  var d=(s.p-P0).toFixed(1), up=s.p>P0;
  document.getElementById('delta').innerHTML='身强度 '+P0+'% → <b style="color:'+
    (up?'#FF7A33':'#5BD08A')+'">'+s.p.toFixed(1)+'%</b>　('+(up?'+':'')+d+')';
  document.getElementById('verdict').innerHTML=s.vd;
}
pick('good');
</script>
</body>
</html>
